name: Plugin validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin metadata and prompt surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON, manifest paths, frontmatter, safety patterns, and secrets
        run: python3 tests/validate_plugin.py

      - name: Validate with Claude Code when already available
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict plugins/databasin
            claude plugin validate --strict .claude-plugin/marketplace.json
          else
            echo "Claude Code is not installed on this runner; skipping optional plugin validation."
          fi
